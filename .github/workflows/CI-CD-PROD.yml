name: Deploy Produção

on:
  push:
    branches:
      - main

  workflow_dispatch:

concurrency:
  group: production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy Produção
    runs-on: self-hosted

    env:
      GESTAODECONTASPRO_DB_CONNECTION: ${{ secrets.GESTAODECONTASPRO_DB_CONNECTION }}
      GESTAODECONTASPRO_SMTP_SERVER: ${{ secrets.GESTAODECONTASPRO_SMTP_SERVER }}
      GESTAODECONTASPRO_SMTP_PORT: ${{ secrets.GESTAODECONTASPRO_SMTP_PORT }}
      GESTAODECONTASPRO_SMTP_USER: ${{ secrets.GESTAODECONTASPRO_SMTP_USER }}
      GESTAODECONTASPRO_SMTP_PW: ${{ secrets.GESTAODECONTASPRO_SMTP_PW }}

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Construir imagem Docker
        working-directory: GestaoDeContasPRO/GestaoDeContasPRO
        run: |
          docker build \
            --rm \
            -t gestaodecontaspro-app .

      - name: Verificar imagem criada
        run: |
          docker image inspect gestaodecontaspro-app

      - name: Parar e remover contentor atual
        run: |
          docker stop gestaodecontaspro-app || true
          docker rm gestaodecontaspro-app || true

      - name: Iniciar nova versão
        run: |
          docker run -d \
            --name gestaodecontaspro-app \
            --restart unless-stopped \
            --network mrserver-network \
            -v /opt/gestaodecontaspro/keys:/keys \
            -e ConnectionStrings__DefaultConnection="$GESTAODECONTASPRO_DB_CONNECTION" \
            -e SmtpSettings__SmtpServer="$GESTAODECONTASPRO_SMTP_SERVER" \
            -e SmtpSettings__SmtpPort="$GESTAODECONTASPRO_SMTP_PORT" \
            -e SmtpSettings__User="$GESTAODECONTASPRO_SMTP_USER" \
            -e SmtpSettings__Password="$GESTAODECONTASPRO_SMTP_PW" \
            gestaodecontaspro-app

      - name: Aguardar arranque da aplicação
        run: |
          sleep 10

      - name: Confirmar que o contentor está em execução
        run: |
          if docker ps \
            --filter "name=gestaodecontaspro-app" \
            --filter "status=running" \
            | grep -q gestaodecontaspro-app; then
            echo "Aplicação iniciada com sucesso."
          else
            echo "A aplicação não arrancou."
            echo ""
            echo "=== Logs da aplicação ==="
            docker logs gestaodecontaspro-app || true
            exit 1
          fi

      - name: Limpar recursos não utilizados
        run: |
          docker image prune -af
          docker container prune -f
          docker builder prune -af
          docker system df

      - name: Estado final
        run: |
          echo "=== Contentores em execução ==="
          docker ps

          echo ""
          echo "=== Espaço Docker ==="
          docker system df

          echo ""
          echo "=== Espaço em disco ==="
          df -h
